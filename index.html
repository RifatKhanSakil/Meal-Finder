<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Finder</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <header>

        <div class="logo">
            Meal Finder
        </div>

        <div class="headerText">
            Search delicious meals from around the world
        </div>

    </header>


    <main>

        <div class="searchSection">

            <h1>Find Your Favorite Meal</h1>

            <p>
                Search for meals and discover their cooking instructions.
            </p>

            <div class="searchBox">

                <input
                    id="userInput"
                    type="text"
                    placeholder="Enter a meal name..."
                >

                <button onclick="connect()">
                    Search
                </button>

            </div>

        </div>


        <div id="resultInfo">

        </div>


        <div id="displayArea">

        </div>


        <div id="showAllArea">

        </div>

    </main>


    <footer>

        <h3>Meal Finder</h3>

        <p>
            Search • Discover • Cook
        </p>

        <p>
            MIS 455 Final Practical
        </p>

    </footer>


    <script src="meal.js"></script>

</body>

</html>
